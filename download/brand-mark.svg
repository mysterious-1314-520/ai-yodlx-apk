<?xml version="1.0" encoding="UTF-8"?>
<!-- AI 聚合网关 · 液态玻璃品牌标 (Liquid Glass Brand Mark)
     替换原线框多面体：三面玻璃质感 + 磨砂渐变 + 高光扫光 + 玻璃描边
     viewBox 0 0 24 24，与原站标几何同构 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="AI 聚合网关">
  <defs>
    <!-- 顶面玻璃：最亮 -->
    <linearGradient id="fTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c7d2fe" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.42"/>
    </linearGradient>
    <!-- 中面玻璃：中等 -->
    <linearGradient id="fMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a5b4fc" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.40"/>
    </linearGradient>
    <!-- 底面玻璃：最深 -->
    <linearGradient id="fBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7c8af0" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 玻璃描边：上亮下暗，营造液体折射感 -->
    <linearGradient id="strokeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="strokeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c7d2fe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.88"/>
    </linearGradient>

    <!-- 顶部高光扫光 -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 整体外发光 -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.55" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 外发光底 -->
  <g filter="url(#softGlow)">
    <!-- 底面 -->
    <path d="M4 12.5l8 4.5 8-4.5v4l-8 4.5-8-4.5z"
          fill="url(#fBot)" stroke="url(#strokeBot)" stroke-width="0.85" stroke-linejoin="round"/>
    <!-- 中面 -->
    <path d="M4 7.5l8 4.5 8-4.5v5l-8 4.5-8-4.5v-5z"
          fill="url(#fMid)" stroke="url(#strokeTop)" stroke-width="0.85" stroke-linejoin="round"/>
    <!-- 顶面 -->
    <path d="M12 3l8 4.5-8 4.5-8-4.5z"
          fill="url(#fTop)" stroke="url(#strokeTop)" stroke-width="0.85" stroke-linejoin="round"/>

    <!-- 顶面高光扫光 -->
    <path d="M12 3l8 4.5-8 4.5-8-4.5z" fill="url(#sheen)"/>

    <!-- 棱边反光（左/上边缘更亮） -->
    <path d="M12 3L4 7.5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M12 3L20 7.5" stroke="#ffffff" stroke-opacity="0.30" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M4 7.5L4 16.5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>